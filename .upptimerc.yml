# disguis.es status page, powered by Upptime (GitHub Actions + Pages).
# Config reference: https://upptime.js.org/docs/configuration
owner: caiquepessan
repo: disguises-status

sites:
  - name: Website
    url: https://disguis.es/api/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Obfuscation API
    url: https://disguises-api.shardweb.app/health
    __dangerous__body_down_if_text_missing: ok
  - name: Discord Bot
    url: https://disguises-bot.shardweb.app/
    __dangerous__body_down_if_text_missing: online

status-website:
  cname: status.disguis.es
  name: disguis.es
  theme: dark
  introTitle: "**disguis.es** status"
  introMessage: Live status of disguis.es services. Checks run every five minutes from GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: disguis.es
      href: https://disguis.es
    - title: Docs
      href: https://disguis.es/docs

assignees:
  - caiquepessan
